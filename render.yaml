services:
  - type: web
    name: vavilonmarket
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CRYPTO_PAY_TOKEN
        sync: false
      - key: NEWS_CHANNEL
        value: "@vavilonmarketnews"
      - key: BOT_MODE
        value: webhook
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_USER_ID
        sync: false
